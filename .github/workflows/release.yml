name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: glmocr-windows
            binary_path: dist/glmocr
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: glmocr-linux
            binary_path: dist/glmocr
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: glmocr-macos
            binary_path: dist/glmocr
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv (Unix)
        if: matrix.os != 'windows-latest'
        run: uv venv .venv
        shell: bash

      - name: Create venv (Windows)
        if: matrix.os == 'windows-latest'
        run: uv venv .venv
        shell: pwsh

      - name: Install CPU-only torch (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          uv pip install --python .venv/bin/python \
            torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
        shell: bash

      - name: Install CPU-only torch (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          uv pip install --python .venv\Scripts\python.exe `
            torch torchvision `
            --index-url https://download.pytorch.org/whl/cpu
        shell: pwsh

      - name: Install selfhosted deps + pyinstaller (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          uv pip install --python .venv/bin/python \
            transformers sentencepiece accelerate \
            "opencv-python-headless>=4.10.0" pypdfium2 \
            pyinstaller
          uv pip install --python .venv/bin/python -e . --no-deps
        shell: bash

      - name: Install selfhosted deps + pyinstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          uv pip install --python .venv\Scripts\python.exe `
            transformers sentencepiece accelerate `
            "opencv-python-headless>=4.10.0" pypdfium2 `
            pyinstaller
          uv pip install --python .venv\Scripts\python.exe -e . --no-deps
        shell: pwsh

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: .venv/bin/pyinstaller glmocr.spec
        shell: bash

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: .venv\Scripts\pyinstaller.exe glmocr.spec
        shell: pwsh

      - name: Smoke test binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./dist/glmocr/glmocr --help
          ./dist/glmocr/glmocr --help | grep -v -i "api.key\|maas\|zhipu\|cloud" && echo "PASS: no cloud refs in help"
        shell: bash

      - name: Smoke test binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\dist\glmocr\glmocr.exe --help
          $help = .\dist\glmocr\glmocr.exe --help 2>&1 | Out-String
          if ($help -match "api.key|maas|zhipu|cloud") { Write-Error "FAIL: cloud refs in help" } else { Write-Host "PASS: no cloud refs in help" }
        shell: pwsh

      - name: Archive Linux/macOS binary
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist glmocr
        shell: bash

      - name: Archive Windows binary
        if: matrix.archive_ext == 'zip'
        run: Compress-Archive -Path dist\glmocr -DestinationPath ${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glmocr-windows.zip
            glmocr-linux.tar.gz
            glmocr-macos.tar.gz
          generate_release_notes: true
